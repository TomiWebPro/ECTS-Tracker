name: ects_tracker
description: "Standalone Flutter ECTS study-progress tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (Riverpod per AGENTS.md §3).
  flutter_riverpod: ^2.5.1

  # Local database (Drift / SQLite per AGENTS.md §3).
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.3
  flutter_svg: ^2.0.10
  liquid_glass_easy: ^5.2.0
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation.
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/ects-tracker-logo.svg
    - assets/images/ects-tracker-logo.png
